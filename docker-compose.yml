services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      MYSQL_DATABASE: jobsearchdb
    ports:
      - "3306:3306"
    volumes:
      - jobsearch-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p${DB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jobsearch-mysql:
